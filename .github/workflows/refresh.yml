name: Refresh Akari Food Index

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: food-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OFF_EXPORT_URL: https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
    steps:
      - uses: actions/checkout@v5

      - name: Verify the index builder
        run: python3 -m unittest test_index.py

      - name: Download the official Open Food Facts export
        run: |
          mkdir -p downloads dist
          curl --fail --location --retry 5 --retry-delay 20 \
            --output downloads/openfoodfacts-products.csv.gz \
            "$OFF_EXPORT_URL"

      - name: Build country catalogues
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          CATALOG_VERSION="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "CATALOG_VERSION=$CATALOG_VERSION" >> "$GITHUB_ENV"
          python3 build_index.py \
            --off-export downloads/openfoodfacts-products.csv.gz \
            --market DE=en:germany \
            --market AT=en:austria \
            --market CH=en:switzerland \
            --market US=en:united-states \
            --market CA=en:canada \
            --market GB=en:united-kingdom \
            --market IE=en:ireland \
            --market AU=en:australia \
            --market NZ=en:new-zealand \
            --output-dir dist \
            --base-url "$RELEASE_BASE_URL" \
            --catalog-version "$CATALOG_VERSION"

      - name: Check out Akari's national reference index
        uses: actions/checkout@v5
        with:
          repository: hejrafa/Akari
          ref: main
          path: akari-reference
          sparse-checkout: Akari/ReferenceFoods.sqlite
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.AKARI_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Stage Akari's national reference index
        run: |
          cp akari-reference/Akari/ReferenceFoods.sqlite \
            dist/reference-foods.sqlite

      - name: Verify generated databases
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sqlite3
          root = pathlib.Path("dist")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["schemaVersion"] == 1
          for market, asset in manifest["markets"].items():
              path = root / asset["filename"]
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              digest = digest.hexdigest()
              assert digest == asset["sha256"], market
              database = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
              assert database.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              assert database.execute("PRAGMA user_version").fetchone()[0] == 1
              assert database.execute("SELECT value FROM metadata WHERE key='market'").fetchone()[0] == market
              database.close()

          reference_path = root / "reference-foods.sqlite"
          database = sqlite3.connect(f"file:{reference_path}?mode=ro", uri=True)
          assert database.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          assert database.execute("PRAGMA application_id").fetchone()[0] == 1095455302
          assert database.execute("PRAGMA user_version").fetchone()[0] == 3
          source_counts = dict(database.execute(
              "SELECT source, COUNT(*) FROM reference_food GROUP BY source"))
          assert set(source_counts) == {"bls", "usda", "cofid", "ciqual", "mext"}
          assert all(count > 0 for count in source_counts.values())
          verified_counts = dict(database.execute(
              "SELECT source, COUNT(*) FROM reference_food WHERE is_verified = 1 GROUP BY source"))
          assert verified_counts == {"bls": 101, "usda": 2}
          sources = json.loads(database.execute(
              "SELECT value FROM metadata WHERE key='sources'").fetchone()[0])
          assert set(sources) == set(source_counts)
          source_files = json.loads(database.execute(
              "SELECT value FROM metadata WHERE key='source_files'").fetchone()[0])
          assert set(source_files) >= {"cofid", "ciqual", "mext"}
          assert all(item.get("sha256") and item.get("size", 0) > 0
                     for items in source_files.values() for item in items)
          database.close()

          digest = hashlib.sha256(reference_path.read_bytes()).hexdigest()
          reference_manifest = {
              "schemaVersion": 3,
              "filename": reference_path.name,
              "sha256": digest,
              "size": reference_path.stat().st_size,
              "foodCount": sum(source_counts.values()),
              "foodCountBySource": source_counts,
              "verifiedFoodCount": sum(verified_counts.values()),
              "sources": sources,
              "sourceFiles": source_files,
          }
          (root / "reference-manifest.json").write_text(
              json.dumps(reference_manifest, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Publish immutable snapshot and move latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="catalog-$(date -u +'%Y%m%d')-${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" dist/* \
            --title "Akari Food Index $CATALOG_VERSION" \
            --notes "Open Food Facts market snapshots plus Akari's separate BLS, USDA, CoFID, Ciqual, and MEXT generic-food reference index. See LICENSE.md for source-specific terms and attribution." \
            --latest

      - name: Remove local source export
        if: always()
        run: rm -f downloads/openfoodfacts-products.csv.gz
