name: Refresh Akari Food Index

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: food-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OFF_EXPORT_URL: https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz
      R2_BUCKET: akari-food-index
      R2_BASE_URL: https://foods.joinakari.com/latest
      # R2's S3 API ignores the region, and needs none of the extra checksums
      # newer AWS CLI versions add by default.
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v5

      - name: Verify the index builder
        run: python3 -m unittest discover -p 'test_*.py'

      - name: Check out Akari's national reference index
        uses: actions/checkout@v5
        with:
          repository: hejrafa/Akari
          ref: main
          path: akari-reference
          sparse-checkout: Akari/ReferenceFoods.sqlite
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.AKARI_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Compile current category identities against the national table
        run: |
          mkdir -p downloads dist
          curl --fail --location --retry 3 --output downloads/categories.json \
            https://static.openfoodfacts.org/data/taxonomies/categories.json
          python3 build_food_taxonomy.py --taxonomy downloads/categories.json \
            --reference-index akari-reference/Akari/ReferenceFoods.sqlite \
            --output food-category-taxonomy.json --report dist/taxonomy-audit.json

      - name: Stream the official export into country catalogues
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          set -o pipefail
          CATALOG_VERSION="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "CATALOG_VERSION=$CATALOG_VERSION" >> "$GITHUB_ENV"
          curl --fail --location --retry 5 --retry-delay 20 "$OFF_EXPORT_URL" | \
          python3 build_index.py --off-export - --off-export-gzip \
            --market DE=en:germany \
            --market AT=en:austria \
            --market CH=en:switzerland \
            --market US=en:united-states \
            --market CA=en:canada \
            --market GB=en:united-kingdom \
            --market IE=en:ireland \
            --market AU=en:australia \
            --market NZ=en:new-zealand \
            --output-dir dist \
            --base-url "$RELEASE_BASE_URL" \
            --catalog-version "$CATALOG_VERSION"

      - name: Stage Akari's national reference index
        run: |
          cp akari-reference/Akari/ReferenceFoods.sqlite \
            dist/reference-foods.sqlite

      - name: Cross-check every SKU and quarantine impossible nutrient values
        run: |
          python3 audit_food_quality.py dist --references dist/reference-foods.sqlite \
            --reclassify --output dist/food-quality-audit.json

      - name: Verify generated databases
        run: |
          python3 verify_release.py dist
          python3 - <<'PY'
          import hashlib, json, pathlib, sqlite3
          from verify_release import verify_reference_coverage
          root = pathlib.Path("dist")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["schemaVersion"] == 4
          for market, asset in manifest["markets"].items():
              path = root / asset["filename"]
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              digest = digest.hexdigest()
              assert digest == asset["sha256"], market
              database = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
              assert database.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              assert database.execute("PRAGMA user_version").fetchone()[0] == 4
              assert database.execute("SELECT value FROM metadata WHERE key='nutrition_provenance'").fetchone()[0] == "reported-json-input-sets"
              assert database.execute("SELECT value FROM metadata WHERE key='market'").fetchone()[0] == market
              database.close()

          reference_path = root / "reference-foods.sqlite"
          database = sqlite3.connect(f"file:{reference_path}?mode=ro", uri=True)
          assert database.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          assert database.execute("PRAGMA application_id").fetchone()[0] == 1095455302
          reference_schema = database.execute("PRAGMA user_version").fetchone()[0]
          assert reference_schema in (3, 4, 5, 6)
          source_counts = dict(database.execute(
              "SELECT source, COUNT(*) FROM reference_food GROUP BY source"))
          verified_counts = dict(database.execute(
              "SELECT source, COUNT(*) FROM reference_food WHERE is_verified = 1 GROUP BY source"))
          verify_reference_coverage(source_counts, verified_counts)
          sources = json.loads(database.execute(
              "SELECT value FROM metadata WHERE key='sources'").fetchone()[0])
          assert set(sources) == set(source_counts)
          source_files = json.loads(database.execute(
              "SELECT value FROM metadata WHERE key='source_files'").fetchone()[0])
          assert set(source_files) >= {"cofid", "ciqual", "mext"}
          if reference_schema >= 4:
              assert "usda" in source_files
          assert all(item.get("sha256") and item.get("size", 0) > 0
                     for items in source_files.values() for item in items)
          database.close()

          digest = hashlib.sha256(reference_path.read_bytes()).hexdigest()
          reference_manifest = {
              "schemaVersion": reference_schema,
              "filename": reference_path.name,
              "sha256": digest,
              "size": reference_path.stat().st_size,
              "foodCount": sum(source_counts.values()),
              "foodCountBySource": source_counts,
              "verifiedFoodCount": sum(verified_counts.values()),
              "sources": sources,
              "sourceFiles": source_files,
          }
          (root / "reference-manifest.json").write_text(
              json.dumps(reference_manifest, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Audit classification coverage and queue unresolved families
        run: python3 audit_classification.py dist --output dist/classification-audit.json

      - name: Keep legacy clients on their compatible catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-release
          PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName)"
          gh release download "$PREVIOUS_TAG" --pattern manifest.json --dir previous-release
          # The R2 copy carries the same catalogue, addressed to its own host.
          # It is staged first, outside dist/, because the GitHub staging below
          # renames the databases and replaces dist/manifest.json.
          python3 prepare_release.py --directory dist \
            --previous-manifest previous-release/manifest.json \
            --previous-tag "$PREVIOUS_TAG" \
            --base-url "$R2_BASE_URL" \
            --output r2-manifests
          python3 prepare_release.py --directory dist \
            --previous-manifest previous-release/manifest.json \
            --previous-tag "$PREVIOUS_TAG" \
            --base-url "https://github.com/${{ github.repository }}/releases/latest/download"

      # The app reads https://foods.joinakari.com/latest/, an R2 bucket (EU
      # jurisdiction). Wrangler uploads at most 315 MB per object and cannot
      # list objects, so the R2 steps use R2's S3 API through the runner's AWS
      # CLI, which sends the large catalogues as multipart uploads. Its key pair
      # comes from CLOUDFLARE_API_TOKEN: the key id is the token's id, the
      # secret the SHA-256 of the token. The token needs Account > Workers R2
      # Storage > Edit, which reads, writes, lists and deletes objects;
      # CLOUDFLARE_ACCOUNT_ID names the account. Any failure here ends the run
      # before the GitHub release, so both copies carry the same catalogue.
      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets. Nothing was uploaded and no GitHub release was made."
            exit 1
          fi
          # A broken build must not fill R2's 10 GB free tier.
          DIST_BYTES="$(du -sb dist | cut -f1)"
          if [ "$DIST_BYTES" -gt 3000000000 ]; then
            echo "::error::dist/ holds $DIST_BYTES bytes, more than 3 GB. Nothing was uploaded."
            exit 1
          fi

          token_id() {
            curl --silent --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1" \
              | jq -r 'select(.success == true) | .result.id // empty' 2>/dev/null || true
          }
          TOKEN_ID="$(token_id https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ -z "$TOKEN_ID" ]; then
            TOKEN_ID="$(token_id "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          fi
          if [ -z "$TOKEN_ID" ]; then
            echo "::error::Cloudflare does not accept CLOUDFLARE_API_TOKEN. Nothing was uploaded."
            exit 1
          fi
          SECRET="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$SECRET"
          export AWS_ACCESS_KEY_ID="$TOKEN_ID" AWS_SECRET_ACCESS_KEY="$SECRET"
          export AWS_ENDPOINT_URL="https://$CLOUDFLARE_ACCOUNT_ID.eu.r2.cloudflarestorage.com"
          RELEASE_TAG="catalog-$(date -u +'%Y%m%d')-${GITHUB_RUN_NUMBER}"
          # The GitHub release and the snapshot cleanup use the same tag and keys.
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL=$AWS_ENDPOINT_URL"
          } >> "$GITHUB_ENV"

          put() {
            local file="$1" key="$2" type
            shift 2
            case "$file" in
              *.sqlite) type=application/octet-stream ;;
              *.json) type=application/json ;;
              *) echo "::error::No content type for $file"; exit 1 ;;
            esac
            aws s3 cp "$file" "s3://$R2_BUCKET/$key" --content-type "$type" --no-progress "$@"
          }
          # Every build file, with the R2-addressed manifests in place of the
          # GitHub ones. The immutable snapshot goes first, latest/ after it;
          # in each, the manifests come last and manifest-v4.json, which the app
          # reads, last of all, so no client sees a manifest before its files.
          # latest/ is replaced every week, so clients revalidate it.
          files=()
          for path in dist/*; do
            case "$(basename "$path")" in
              manifest.json|manifest-v4.json) ;;
              *) files+=("$path") ;;
            esac
          done
          upload_copy() {
            local prefix="$1" path
            shift
            for path in "${files[@]}"; do
              put "$path" "$prefix/$(basename "$path")" "$@"
            done
            put r2-manifests/manifest.json "$prefix/manifest.json" "$@"
            put r2-manifests/manifest-v4.json "$prefix/manifest-v4.json" "$@"
          }
          upload_copy "releases/$RELEASE_TAG"
          upload_copy latest --cache-control no-cache

      - name: Publish immutable snapshot and move latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "Akari Food Index $CATALOG_VERSION" \
            --notes "Open Food Facts market snapshots plus Akari's separate BLS, USDA, CoFID, Ciqual, and MEXT generic-food reference index. See LICENSE.md for source-specific terms and attribution." \
            --latest

      # Keeps the newest three releases/<tag>/ snapshots in R2, this run's
      # among them. Tags sort by date, then run number. Only releases/ is
      # listed, so latest/ is never touched.
      - name: Remove R2 snapshots older than the newest three
        run: |
          set -euo pipefail
          listed="$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" \
            --prefix releases/ --delimiter / \
            --query 'CommonPrefixes[].Prefix' --output text \
            | tr '\t' '\n' | grep -E '^releases/catalog-[0-9]{8}-[0-9]+/$' | sort -V || true)"
          if ! grep -qxF "releases/$RELEASE_TAG/" <<< "$listed"; then
            echo "::error::releases/$RELEASE_TAG/ is not listed in R2. Nothing was removed."
            exit 1
          fi
          for prefix in $(head -n -3 <<< "$listed"); do
            echo "Removing $prefix"
            aws s3 rm "s3://$R2_BUCKET/$prefix" --recursive --only-show-errors
          done
